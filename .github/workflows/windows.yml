name: Windows installer and offline model packs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'tools/**'
      - 'tests/**'
      - 'web/sample.wav'
      - '.github/workflows/windows.yml'
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r desktop/requirements.txt pyinstaller==6.16.0
      - run: python tools/fetch_model.py base
      - run: python tools/make_icon.py
      - name: Freeze Windows app
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name LiveScribe --icon build/livescribe.ico
          --paths .
          --collect-all sherpa_onnx --collect-all sherpa_onnx_core
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all sounddevice --collect-all _sounddevice_data
          --add-data "build/models;models" desktop/app.py
      - name: Verify bundled CPU inference
        run: |
          $proc = Start-Process -FilePath 'dist/LiveScribe/LiveScribe.exe' -ArgumentList '--self-test','web/sample.wav','build/self-test.txt' -Wait -PassThru
          if (Test-Path 'build/self-test.txt') { Get-Content build/self-test.txt }
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
      - name: Compile offline installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc tools/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $path = 'release/LiveScribe-Setup-x64-Offline.exe'
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          "$hash  LiveScribe-Setup-x64-Offline.exe" | Set-Content "$path.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-offline-installer
          path: release/*
          if-no-files-found: error
  packs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [tiny, small, parakeet, turbo]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/fetch_model.py ${{ matrix.model }} --zip-dir release
      - uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.model }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
  release:
    runs-on: ubuntu-latest
    needs: [installer, packs]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "LiveScribe 0.1.0" --notes "Windows x64 offline installer with Whisper Base. Other models are optional offline packs. Unzip a pack, then import its model folder in Settings. No transcript or audio is uploaded."
          fi
